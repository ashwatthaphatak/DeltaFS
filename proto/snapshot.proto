syntax = "proto3";

package deltafs.v1;

import "common.proto";

message SnapshotInfo {
  string snapshot_id = 1;
  string name = 2;
  uint64 root_version = 3;
  int64 created_at_unix_ms = 4;
}

service SnapshotService {
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc ReadAtSnapshot(ReadAtSnapshotRequest) returns (ReadAtSnapshotResponse);
}

message CreateSnapshotRequest {
  RequestContext context = 1;
  string name = 2;
}

message CreateSnapshotResponse {
  ErrorStatus error = 1;
  string snapshot_id = 2;
  uint64 root_version = 3;
  uint64 lsn = 4;
}

message ListSnapshotsRequest {
  RequestContext context = 1;
}

message ListSnapshotsResponse {
  ErrorStatus error = 1;
  repeated SnapshotInfo snapshots = 2;
}

message ReadAtSnapshotRequest {
  RequestContext context = 1;
  string snapshot_id = 2;
  string key = 3;
}

message ReadAtSnapshotResponse {
  ErrorStatus error = 1;
  bool found = 2;
  string block_id = 3;
  bytes value = 4;
  uint64 root_version = 5;
}
