syntax = "proto3";

package deltafs.v1;

message RequestContext {
  string request_id = 1;
  string node_id = 2;
  int64 client_timestamp_unix_ms = 3;
}

message ErrorDetail {
  string key = 1;
  string value = 2;
}

message ErrorStatus {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  repeated ErrorDetail details = 4;
}
