syntax = "proto3";

package deltafs.v1;

import "common.proto";

message StoragePath {
  string label = 1;
  string path = 2;
}

service AdminService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc ForceConsistencyPoint(ForceConsistencyPointRequest) returns (ForceConsistencyPointResponse);
  rpc PromoteToLeader(PromoteToLeaderRequest) returns (PromoteToLeaderResponse);
}

message GetStatusRequest {
  RequestContext context = 1;
}

message GetStatusResponse {
  ErrorStatus error = 1;
  string node_id = 2;
  string role = 3;
  string leader_id = 4;
  uint64 commit_index = 5;
  uint64 last_applied = 6;
  uint64 committed_root = 7;
  uint64 snapshots_count = 8;
  repeated string peer_endpoints = 9;
  repeated StoragePath storage_paths = 10;
}

message ForceConsistencyPointRequest {
  RequestContext context = 1;
}

message ForceConsistencyPointResponse {
  ErrorStatus error = 1;
  bool forced = 2;
  uint64 commit_index = 3;
  uint64 committed_root = 4;
}

message PromoteToLeaderRequest {
  RequestContext context = 1;
  bool force = 2;
}

message PromoteToLeaderResponse {
  ErrorStatus error = 1;
  bool promoted = 2;
  string role = 3;
}
